services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    command: [--config=/etc/otelcol-contrib/config.yaml]
    restart: unless-stopped
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - '${OTEL_GRPC_PORT:-4317}:4317'
      - '${OTEL_HTTP_PORT:-4318}:4318'
    depends_on:
      loki:
        condition: service_healthy
    networks: [application, observability]

  prometheus:
    image: prom/prometheus:v3.11.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    depends_on: [otel-collector]
    networks: [observability]

  loki:
    image: grafana/loki:3.7.2
    command: [-config.file=/etc/loki/config.yaml]
    restart: unless-stopped
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - '${LOKI_PORT:-3100}:3100'
    healthcheck:
      test: [CMD, /usr/bin/loki, -version]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [observability]

  grafana:
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-geo_grafana_local_password}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-geo_admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '${GRAFANA_PORT:-3002}:3000'
    depends_on: [prometheus, loki]
    networks: [observability]

networks:
  application:
    driver: bridge
  observability:
    driver: bridge

volumes:
  grafana-data:
  loki-data:
  prometheus-data:
