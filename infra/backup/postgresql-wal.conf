# Mount /var/lib/postgresql/wal-archive on durable storage separate from PGDATA.
# Five minutes leaves operational margin inside the frozen RPO <= 15 minute target.
wal_level = replica
archive_mode = on
archive_timeout = '5min'
archive_command = 'if [ -f /var/lib/postgresql/wal-archive/%f ]; then cmp -s %p /var/lib/postgresql/wal-archive/%f; else cp %p /var/lib/postgresql/wal-archive/%f; fi'
wal_compression = on
