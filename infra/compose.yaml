      DOUYIN_EDITOR_URL: ${DOUYIN_EDITOR_URL:-https://creator.douyin.com/creator-micro/content/upload}
      DOUYIN_LOGIN_URL: ${DOUYIN_LOGIN_URL:-https://creator.douyin.com/}
      DOUYIN_MANAGE_URL: ${DOUYIN_MANAGE_URL:-https://creator.douyin.com/creator-micro/content/manage}
      DATABASE_URL: postgresql://${POSTGRES_USER:-geo}:${POSTGRES_PASSWORD:-geo_local_password}@postgres:5432/${POSTGRES_DB:-geo_content_os_dev}
      HEALTH_PORT: '9098'
      NODE_ENV: development
      PUBLISHING_CREDENTIAL_KEY_BASE64: ${PUBLISHING_CREDENTIAL_KEY_BASE64:?PUBLISHING_CREDENTIAL_KEY_BASE64 must be set via --env-file .env}
      PUBLISHING_CREDENTIAL_KEY_VERSION: ${PUBLISHING_CREDENTIAL_KEY_VERSION:-local-v1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-geo_minio}
      S3_AUTO_CREATE_BUCKET: 'true'
      S3_BUCKET: ${S3_BUCKET:-geo-content-os-dev}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-geo_minio_local_password}
      S3_SERVER_SIDE_ENCRYPTION: 'false'
      STORAGE_DRIVER: s3
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:9098/health/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))

  ai-worker:
    <<: *worker-service
    image: geo-content-os/ai-worker:dev
    build:
      context: ..
      dockerfile: infra/docker/ai-worker.Dockerfile
    environment:
      AI_MODEL_DRIVER: ${AI_MODEL_DRIVER:?AI_MODEL_DRIVER must be set via --env-file .env}
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-2}
      DATABASE_URL: postgresql://${POSTGRES_USER:-geo}:${POSTGRES_PASSWORD:-geo_local_password}@postgres:5432/${POSTGRES_DB:-geo_content_os_dev}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MAX_OUTPUT_TOKENS: ${DEEPSEEK_MAX_OUTPUT_TOKENS:-32768}
      DEEPSEEK_MAX_RETRIES: ${DEEPSEEK_MAX_RETRIES:-2}
      DEEPSEEK_MODEL_KEY: ${DEEPSEEK_MODEL_KEY:-deepseek-v4-flash}
      DEEPSEEK_PROVIDER_MODEL_ID: ${DEEPSEEK_PROVIDER_MODEL_ID:-deepseek-v4-flash}
      DEEPSEEK_RETRY_BASE_DELAY_MS: ${DEEPSEEK_RETRY_BASE_DELAY_MS:-500}
      DEEPSEEK_TIMEOUT_MS: ${DEEPSEEK_TIMEOUT_MS:-300000}
      EMBEDDING_DRIVER: ${EMBEDDING_DRIVER:-local}
      EMBEDDING_MODEL_KEY: ${EMBEDDING_MODEL_KEY:-embedding-local-ngram-v1}
      EMBEDDING_TIMEOUT_MS: ${EMBEDDING_TIMEOUT_MS:-30000}
      CONTENT_MODEL_BALANCED_KEY: ${CONTENT_MODEL_BALANCED_KEY:-deepseek-v4-flash}
      CONTENT_MODEL_FAST_KEY: ${CONTENT_MODEL_FAST_KEY:-deepseek-v4-flash}
      CONTENT_MODEL_QUALITY_KEY: ${CONTENT_MODEL_QUALITY_KEY:-deepseek-v4-pro}
      CONTENT_WRITER_PROMPT_VERSION_ID: ${CONTENT_WRITER_PROMPT_VERSION_ID:-25000000-0000-4000-8000-000000000009}
      CONTENT_WRITER_SKILL_VERSION: ${CONTENT_WRITER_SKILL_VERSION:-1.0.0}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_IMAGE_MODEL: ${CLOUDFLARE_IMAGE_MODEL:-@cf/black-forest-labs/flux-1-schnell}
      CLOUDFLARE_IMAGE_QA_MODEL: ${CLOUDFLARE_IMAGE_QA_MODEL:-@cf/meta/llama-3.2-11b-vision-instruct}
      GENERATED_MEDIA_PUBLIC_BASE_URL: ${GENERATED_MEDIA_PUBLIC_BASE_URL:-}
      IMAGE_AUTOMATION_ENABLED: ${IMAGE_AUTOMATION_ENABLED:-true}
      IMAGE_GENERATION_DRIVER: ${IMAGE_GENERATION_DRIVER:-disabled}
      IMAGE_GENERATION_STEPS: ${IMAGE_GENERATION_STEPS:-4}
      IMAGE_PLANNER_MODEL_KEY: ${IMAGE_PLANNER_MODEL_KEY:-deepseek-v4-flash}
      IMAGE_PROVIDER_TIMEOUT_MS: ${IMAGE_PROVIDER_TIMEOUT_MS:-120000}
      QUALITY_CHECKER_MODEL_KEY: ${QUALITY_CHECKER_MODEL_KEY:-deepseek-v4-pro}
      QUALITY_CHECKER_PROMPT_VERSION_ID: ${QUALITY_CHECKER_PROMPT_VERSION_ID:-25000000-0000-4000-8000-000000000007}
      QUALITY_CHECKER_SKILL_VERSION: ${QUALITY_CHECKER_SKILL_VERSION:-1.0.0}
      HEALTH_PORT: '9090'
      NODE_ENV: development
      OFFICIAL_SITE_DAILY_TICK_MS: ${OFFICIAL_SITE_DAILY_TICK_MS:-30000}
      REDIS_URL: redis://redis:6379/0
      RERANK_DRIVER: ${RERANK_DRIVER:-local}
      RERANK_MODEL_KEY: ${RERANK_MODEL_KEY:-rerank-local-ngram-v1}
      RERANK_TIMEOUT_MS: ${RERANK_TIMEOUT_MS:-10000}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-geo_minio}
      S3_AUTO_CREATE_BUCKET: 'true'
      S3_BUCKET: ${S3_BUCKET:-geo-content-os-dev}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-geo_minio_local_password}
      S3_SERVER_SIDE_ENCRYPTION: 'false'
      STORAGE_DRIVER: s3
      WORKER_NAME: ai
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  knowledge-worker:
    <<: *worker-service
    image: geo-content-os/knowledge-worker:dev
    build:
      context: ..
      dockerfile: infra/docker/knowledge-worker.Dockerfile
    environment:
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      DATABASE_URL: postgresql://${POSTGRES_USER:-geo}:${POSTGRES_PASSWORD:-geo_local_password}@postgres:5432/${POSTGRES_DB:-geo_content_os_dev}
      EMBEDDING_DRIVER: ${EMBEDDING_DRIVER:-local}
      EMBEDDING_MAX_BATCH_SIZE: ${EMBEDDING_MAX_BATCH_SIZE:-64}
      EMBEDDING_MODEL_KEY: ${EMBEDDING_MODEL_KEY:-embedding-local-ngram-v1}
      HEALTH_PORT: '9090'
