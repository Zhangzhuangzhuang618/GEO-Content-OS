      PUBLISHER_STALE_AFTER_MS: ${PUBLISHER_STALE_AFTER_MS:-600000}
      PUBLISHER_WORKER_CONCURRENCY: ${PUBLISHER_WORKER_CONCURRENCY:-1}
      PUBLISHING_CREDENTIAL_KEY_BASE64: ${PUBLISHING_CREDENTIAL_KEY_BASE64:?PUBLISHING_CREDENTIAL_KEY_BASE64 must be set via --env-file .env}
      PUBLISHING_CREDENTIAL_KEY_VERSION: ${PUBLISHING_CREDENTIAL_KEY_VERSION:-local-v1}
      REDIS_URL: redis://redis:6379/0
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-geo_minio}
      S3_AUTO_CREATE_BUCKET: 'true'
      S3_BUCKET: ${S3_BUCKET:-geo-content-os-dev}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-geo_minio_local_password}
      S3_SERVER_SIDE_ENCRYPTION: 'false'
      STORAGE_DRIVER: s3
      WORKER_NAME: publisher
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  baijiahao-browser:
    <<: *app-hardening
    image: geo-content-os/baijiahao-browser:dev
    build:
      context: ..
      dockerfile: infra/docker/baijiahao-browser.Dockerfile
    shm_size: 1gb
    tmpfs:
      - /tmp
      - /var/lib/geo-content-os/baijiahao:uid=1001,gid=1001,mode=0700,size=536870912
    environment:
      BAIJIAHAO_BROWSER_GATEWAY_TOKEN: ${BAIJIAHAO_BROWSER_GATEWAY_TOKEN:?BAIJIAHAO_BROWSER_GATEWAY_TOKEN must be set via --env-file .env}
      BAIJIAHAO_BROWSER_HEADLESS: ${BAIJIAHAO_BROWSER_HEADLESS:-true}
      BAIJIAHAO_BROWSER_NAVIGATION_TIMEOUT_MS: ${BAIJIAHAO_BROWSER_NAVIGATION_TIMEOUT_MS:-30000}
      BAIJIAHAO_BROWSER_PROFILE_ROOT: /var/lib/geo-content-os/baijiahao
      BAIJIAHAO_BROWSER_SIMULATOR: ${BAIJIAHAO_BROWSER_SIMULATOR:-false}
