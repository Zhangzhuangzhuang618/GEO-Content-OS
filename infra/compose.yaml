x-app-hardening: &app-hardening
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp
  networks:
    - application

x-node-healthcheck: &node-healthcheck
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 20s

x-worker-service: &worker-service
  <<: *app-hardening
  image: geo-content-os/worker-health:dev
  build:
    context: ..
    dockerfile: infra/docker/worker.Dockerfile
  depends_on:
    api:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    HEALTH_PORT: '9090'
    REDIS_URL: redis://redis:6379/0
  healthcheck:
    <<: *node-healthcheck
    test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:9090/health/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geo_content_os_dev}
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geo_local_password}
      POSTGRES_USER: ${POSTGRES_USER:-geo}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - application

  redis:
    image: redis:7.4.7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - application

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-geo_minio_local_password}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-geo_minio}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, --fail, http://127.0.0.1:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - application

  clamav:
    image: clamav/clamav:1.4.3
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: [CMD-SHELL, 'clamdscan --ping=1']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - application

  migrate:
    <<: *app-hardening
    image: geo-content-os/api:dev
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: 'no'
    command: [node, apps/api/dist/database/cli/migrate.js]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-geo}:${POSTGRES_PASSWORD:-geo_local_password}@postgres:5432/${POSTGRES_DB:-geo_content_os_dev}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-hardening
    image: geo-content-os/api:dev
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      API_HOST: 0.0.0.0
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      BAIJIAHAO_BROWSER_GATEWAY_BASE_URL: http://baijiahao-browser:9095
      BAIJIAHAO_BROWSER_GATEWAY_TOKEN: ${BAIJIAHAO_BROWSER_GATEWAY_TOKEN:?BAIJIAHAO_BROWSER_GATEWAY_TOKEN must be set via --env-file .env}
      BAIJIAHAO_BROWSER_GATEWAY_TIMEOUT_MS: ${BAIJIAHAO_BROWSER_GATEWAY_TIMEOUT_MS:-65000}
      SOHU_BROWSER_GATEWAY_BASE_URL: http://sohu-browser:9096
      SOHU_BROWSER_GATEWAY_TOKEN: ${SOHU_BROWSER_GATEWAY_TOKEN:?SOHU_BROWSER_GATEWAY_TOKEN must be set via --env-file .env}
      SOHU_BROWSER_GATEWAY_TIMEOUT_MS: ${SOHU_BROWSER_GATEWAY_TIMEOUT_MS:-65000}
      LIEJU_BROWSER_GATEWAY_BASE_URL: http://lieju-browser:9097
      LIEJU_BROWSER_GATEWAY_TOKEN: ${LIEJU_BROWSER_GATEWAY_TOKEN:?LIEJU_BROWSER_GATEWAY_TOKEN must be set via --env-file .env}
      LIEJU_BROWSER_GATEWAY_TIMEOUT_MS: ${LIEJU_BROWSER_GATEWAY_TIMEOUT_MS:-65000}
      DOUYIN_BROWSER_GATEWAY_BASE_URL: http://douyin-browser:9098
      DOUYIN_BROWSER_GATEWAY_TOKEN: ${DOUYIN_BROWSER_GATEWAY_TOKEN:?DOUYIN_BROWSER_GATEWAY_TOKEN must be set via --env-file .env}
      DOUYIN_BROWSER_GATEWAY_TIMEOUT_MS: ${DOUYIN_BROWSER_GATEWAY_TIMEOUT_MS:-65000}
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
      CONTENT_MODEL_BALANCED_KEY: ${CONTENT_MODEL_BALANCED_KEY:-deepseek-v4-flash}
      CONTENT_MODEL_FAST_KEY: ${CONTENT_MODEL_FAST_KEY:-deepseek-v4-flash}
      CONTENT_MODEL_QUALITY_KEY: ${CONTENT_MODEL_QUALITY_KEY:-deepseek-v4-pro}
      CONTENT_PLATFORM_RULES_JSON: ${CONTENT_PLATFORM_RULES_JSON:-}
      CONTENT_REQUIRE_PLATFORM_ACCOUNTS: ${CONTENT_REQUIRE_PLATFORM_ACCOUNTS:-true}
      CONTENT_WRITER_PROMPT_VERSION_ID: ${CONTENT_WRITER_PROMPT_VERSION_ID:-25000000-0000-4000-8000-000000000009}
      CONTENT_WRITER_SKILL_VERSION: ${CONTENT_WRITER_SKILL_VERSION:-1.0.0}
      CLOUDFLARE_IMAGE_MODEL: ${CLOUDFLARE_IMAGE_MODEL:-@cf/black-forest-labs/flux-1-schnell}
      CLOUDFLARE_IMAGE_QA_MODEL: ${CLOUDFLARE_IMAGE_QA_MODEL:-@cf/meta/llama-3.2-11b-vision-instruct}
      IMAGE_AUTOMATION_ENABLED: ${IMAGE_AUTOMATION_ENABLED:-true}
      IMAGE_GENERATION_DRIVER: ${IMAGE_GENERATION_DRIVER:-disabled}
      IMAGE_PLANNER_MODEL_KEY: ${IMAGE_PLANNER_MODEL_KEY:-deepseek-v4-flash}
      QUALITY_CHECKER_MODEL_KEY: ${QUALITY_CHECKER_MODEL_KEY:-deepseek-v4-pro}
      QUALITY_CHECKER_PROMPT_VERSION_ID: ${QUALITY_CHECKER_PROMPT_VERSION_ID:-25000000-0000-4000-8000-000000000007}
      QUALITY_CHECKER_SKILL_VERSION: ${QUALITY_CHECKER_SKILL_VERSION:-1.0.0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-geo}:${POSTGRES_PASSWORD:-geo_local_password}@postgres:5432/${POSTGRES_DB:-geo_content_os_dev}
      EMAIL_FROM: '${EMAIL_FROM:-GEO Content OS <no-reply@localhost>}'
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-disabled}
      EMBEDDING_DRIVER: ${EMBEDDING_DRIVER:-local}
      EMBEDDING_MODEL_KEY: ${EMBEDDING_MODEL_KEY:-embedding-local-ngram-v1}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-geo_minio_local_password}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-geo_minio}
      NODE_ENV: development
      PORT: '3000'
      PUBLISHING_CREDENTIAL_KEY_BASE64: ${PUBLISHING_CREDENTIAL_KEY_BASE64:-}
      PUBLISHING_CREDENTIAL_KEY_VERSION: ${PUBLISHING_CREDENTIAL_KEY_VERSION:-local-v1}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      RATE_LIMIT_REDIS_URL: redis://redis:6379/1
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      REDIS_URL: redis://redis:6379/0
      RERANK_DRIVER: ${RERANK_DRIVER:-local}
      RERANK_MODEL_KEY: ${RERANK_MODEL_KEY:-rerank-local-ngram-v1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-geo_minio}
      S3_AUTO_CREATE_BUCKET: 'true'
      S3_BUCKET: ${S3_BUCKET:-geo-content-os-dev}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-geo_minio_local_password}
      S3_SERVER_SIDE_ENCRYPTION: 'false'
      STORAGE_DRIVER: s3
      WEB_FETCH_ALLOWED_HOSTS: ${WEB_FETCH_ALLOWED_HOSTS:-}
      WEB_FETCH_ALLOWED_PORTS: ${WEB_FETCH_ALLOWED_PORTS:-80,443}
      WEB_FETCH_DENIED_HOSTS: ${WEB_FETCH_DENIED_HOSTS:-}
      WEB_FETCH_MAX_BYTES: ${WEB_FETCH_MAX_BYTES:-10485760}
      WEB_FETCH_MAX_REDIRECTS: ${WEB_FETCH_MAX_REDIRECTS:-5}
      WEB_FETCH_TIMEOUT_MS: ${WEB_FETCH_TIMEOUT_MS:-10000}
      WEB_FETCH_USER_AGENT: ${WEB_FETCH_USER_AGENT:-GEO-Content-OS-WebFetch/1.0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      TOPIC_PLANNER_MODEL_KEY: ${TOPIC_PLANNER_MODEL_KEY:-mock-topic-planner}
      TOPIC_PLANNER_PROMPT_VERSION_ID: ${TOPIC_PLANNER_PROMPT_VERSION_ID:-00000000-0000-4000-8000-000000000026}
      TOPIC_PLANNER_SKILL_VERSION: ${TOPIC_PLANNER_SKILL_VERSION:-1.0.0}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      WENTIAN_BASE_URL: ${WENTIAN_BASE_URL:-}
      WENTIAN_GEO_CONNECTOR_ID: ${WENTIAN_GEO_CONNECTOR_ID:-}
      WENTIAN_GEO_CONNECTOR_SECRET: ${WENTIAN_GEO_CONNECTOR_SECRET:-}
      WENTIAN_GEO_TENANT_ID: ${WENTIAN_GEO_TENANT_ID:-}
    ports:
      - '${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3001}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/v1/health/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))

  web:
    <<: *app-hardening
    image: geo-content-os/web:dev
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_INTERNAL_ORIGIN: http://api:3000
    environment:
      API_INTERNAL_ORIGIN: http://api:3000
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: '3000'
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))

