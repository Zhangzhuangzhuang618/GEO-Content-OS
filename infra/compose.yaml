x-app-hardening: &app-hardening
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp
  networks:
    - application

x-node-healthcheck: &node-healthcheck
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 20s

x-worker-service: &worker-service
  <<: *app-hardening
  image: geo-content-os/worker-health:dev
  build:
    context: ..
    dockerfile: infra/docker/worker.Dockerfile
  depends_on:
    api:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    HEALTH_PORT: '9090'
    REDIS_URL: redis://redis:6379/0
  healthcheck:
    <<: *node-healthcheck
    test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:9090/health/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geo_content_os_dev}
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geo_local_password}
      POSTGRES_USER: ${POSTGRES_USER:-geo}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - application

  redis:
    image: redis:7.4.7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - application

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-geo_minio_local_password}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-geo_minio}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, --fail, http://127.0.0.1:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - application

  migrate:
    <<: *app-hardening
    image: geo-content-os/api:dev
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: 'no'
    command: [node, apps/api/dist/database/cli/migrate.js]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-geo}:${POSTGRES_PASSWORD:-geo_local_password}@postgres:5432/${POSTGRES_DB:-geo_content_os_dev}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-hardening
    image: geo-content-os/api:dev
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      API_HOST: 0.0.0.0
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-geo}:${POSTGRES_PASSWORD:-geo_local_password}@postgres:5432/${POSTGRES_DB:-geo_content_os_dev}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-geo_minio_local_password}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-geo_minio}
      NODE_ENV: development
      PORT: '3000'
      RATE_LIMIT_REDIS_URL: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
      S3_BUCKET: ${S3_BUCKET:-geo-content-os-dev}
    ports:
      - '${API_PORT:-3001}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/v1/health/ready').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))

  web:
    <<: *app-hardening
    image: geo-content-os/web:dev
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: '3000'
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *node-healthcheck
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))

  outbox-relay:
    <<: *worker-service
    image: geo-content-os/outbox-relay:dev
    build:
      context: ..
      dockerfile: infra/docker/outbox-relay.Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-geo}:${POSTGRES_PASSWORD:-geo_local_password}@postgres:5432/${POSTGRES_DB:-geo_content_os_dev}
      HEALTH_PORT: '9090'
      REDIS_URL: redis://redis:6379/0
      WORKER_NAME: outbox-relay

  publisher-worker:
    <<: *worker-service
    environment:
      HEALTH_PORT: '9090'
      REDIS_URL: redis://redis:6379/0
      WORKER_NAME: publisher

  ai-worker:
    <<: *worker-service
    environment:
      HEALTH_PORT: '9090'
      REDIS_URL: redis://redis:6379/0
      WORKER_NAME: ai

  knowledge-worker:
    <<: *worker-service
    environment:
      HEALTH_PORT: '9090'
      REDIS_URL: redis://redis:6379/0
      WORKER_NAME: knowledge

  analytics-worker:
    <<: *worker-service
    environment:
      HEALTH_PORT: '9090'
      REDIS_URL: redis://redis:6379/0
      WORKER_NAME: analytics

  lifecycle-worker:
    <<: *worker-service
    environment:
      HEALTH_PORT: '9090'
      REDIS_URL: redis://redis:6379/0
      WORKER_NAME: lifecycle

networks:
  application:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  redis-data:
