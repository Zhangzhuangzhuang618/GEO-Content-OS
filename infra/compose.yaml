      NODE_ENV: development
      OCR_DRIVER: ${OCR_DRIVER:-disabled}
      REDIS_URL: redis://redis:6379/0
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-geo_minio}
      S3_AUTO_CREATE_BUCKET: 'true'
      S3_BUCKET: ${S3_BUCKET:-geo-content-os-dev}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 'true'
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-geo_minio_local_password}
      S3_SERVER_SIDE_ENCRYPTION: 'false'
      STORAGE_DRIVER: s3
      WEB_FETCH_ALLOWED_HOSTS: ${WEB_FETCH_ALLOWED_HOSTS:-}
